# ShopGuard pipeline for GitLab CI
#
# A port of .github/workflows/ci.yml. It has not been executed in this repository (the
# project is hosted on GitHub); it shows how the same pyramid maps to GitLab stages.
#
#   build -> unit -> integration -> api -> ui (own runner) -> report
#
# Test selection is tag-based: Reqnroll tags become NUnit categories
#   @api / @ui / @db / @smoke / @wip  ->  --filter "TestCategory=..."

stages: [build, unit, integration, api, ui, report]

# One pipeline per merge request, per push to the default branch and per schedule. Without
# this block, jobs that have no rules of their own would not join merge request pipelines.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget"
  COVERAGE_THRESHOLD: "90"

default:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  cache:
    key:
      files: [ShopGuard/ShopGuard.slnx]
    paths: [.nuget]

build:
  stage: build
  script:
    - dotnet build ShopGuard -c Release

unit:
  stage: unit
  # Fail fast: if unit tests are red, no container and no browser is ever started.
  script:
    - dotnet test ShopGuard/ShopGuard.UnitTests -c Release
        --collect:"XPlat Code Coverage"
        --logger "junit;LogFilePath=$CI_PROJECT_DIR/TestResults/unit.junit.xml"
        --results-directory TestResults/unit
  artifacts:
    when: always
    expire_in: 1 week
    paths: [TestResults/]
    reports:
      junit: TestResults/unit.junit.xml

integration:
  stage: integration
  # Testcontainers needs a Docker daemon; on GitLab that is a docker-in-docker service.
  services:
    - name: docker:dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  script:
    - dotnet test ShopGuard/ShopGuard.IntegrationTests -c Release
        --collect:"XPlat Code Coverage"
        --logger "junit;LogFilePath=$CI_PROJECT_DIR/TestResults/integration.junit.xml"
        --results-directory TestResults/integration
    # Coverage of ShopGuard.Core from unit + integration tests, with a minimum.
    - dotnet tool install --global dotnet-reportgenerator-globaltool
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - reportgenerator
        -reports:"TestResults/**/coverage.cobertura.xml"
        -targetdir:coverage
        -reporttypes:"Html;TextSummary;Cobertura"
        -assemblyfilters:"+ShopGuard.Core"
    - cat coverage/Summary.txt
    - line=$(grep -m1 "Line coverage" coverage/Summary.txt | grep -oE "[0-9]+(\.[0-9]+)?")
    - awk -v actual="$line" -v minimum="$COVERAGE_THRESHOLD" 'BEGIN { exit (actual + 0 < minimum + 0) }'
  coverage: '/Line coverage: \d+\.?\d*%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths: [coverage/, TestResults/]
    reports:
      junit: TestResults/integration.junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/Cobertura.xml

api:
  stage: api
  # The API under test is a shared public demo; the job (not single scenarios) may be retried.
  retry:
    max: 2
    when: [script_failure, runner_system_failure]
  script:
    - dotnet test ShopGuard/ShopGuard.E2ETests -c Release
        --filter "TestCategory=api"
        --logger "junit;LogFilePath=$CI_PROJECT_DIR/TestResults/api.junit.xml"
    - mkdir -p api-report
    - cp ShopGuard/ShopGuard.E2ETests/bin/Release/net10.0/reqnroll-report.html api-report/index.html
  artifacts:
    when: always
    expire_in: 1 week
    paths: [TestResults/, api-report/]
    reports:
      junit: TestResults/api.junit.xml

# UI and database scenarios need the self-hosted Toolshop. Its images mix amd64 and arm64, so
# the job runs on a project runner with the shell executor on a host that runs both (Docker
# Desktop, or Linux with QEMU registered) and has the .NET SDK and the Playwright browser
# installed (tags: toolshop, docker).
ui:
  stage: ui
  tags: [toolshop, docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    SHOPGUARD_ENV: "selfhosted"
    HEADLESS: "true"
  before_script:
    - scripts/start-toolshop.sh
  script:
    - dotnet test ShopGuard/ShopGuard.E2ETests -c Release
        --filter "TestCategory=ui&TestCategory!=wip"
        --logger "junit;LogFilePath=$CI_PROJECT_DIR/TestResults/ui.junit.xml"
  after_script:
    - docker compose -f docker/toolshop.compose.yml down
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ShopGuard/ShopGuard.E2ETests/bin/Release/net10.0/artifacts/
      - ShopGuard/ShopGuard.E2ETests/bin/Release/net10.0/reqnroll-report.html
      - TestResults/
    reports:
      junit: TestResults/ui.junit.xml

# Publishes coverage and the API execution report as GitLab Pages.
pages:
  stage: report
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs: [integration, api]
  script:
    - mkdir -p public/coverage
    - cp -r coverage/* public/coverage/
    # The API execution report is the start page; coverage lives under /coverage.
    - cp api-report/index.html public/index.html
  artifacts:
    paths: [public]
