name: CI

# Fail-fast test pyramid on hosted runners:
#   unit   unit tests + integration tests (real MariaDB in a container) + coverage gate
#   api    REST scenarios against restful-booker
#   ui     Playwright scenarios and database checks against a self-hosted Toolshop
#   pages  publishes test reports, living documentation and coverage to GitHub Pages
#
# api and ui run in parallel once unit is green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays 05:00 UTC. The API under test belongs to a third party and changes without a
    # commit in this repository; the weekly run notices that.
    - cron: "0 5 * * 1"

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # Minimum line coverage of ShopGuard.Core. The build fails below it.
  COVERAGE_THRESHOLD: "90"

jobs:
  # Fast feedback. If this is red, nothing else runs.
  unit:
    name: Unit, integration & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build ShopGuard -c Release

      - name: Unit tests
        run: |
          dotnet test ShopGuard/ShopGuard.UnitTests -c Release --no-build \
            --collect:"XPlat Code Coverage" \
            --logger "junit;LogFilePath=$GITHUB_WORKSPACE/TestResults/unit.junit.xml" \
            --results-directory TestResults

      # Testcontainers starts a throw-away MariaDB; Docker is preinstalled on the runner.
      - name: Integration tests (MariaDB via Testcontainers)
        run: |
          dotnet test ShopGuard/ShopGuard.IntegrationTests -c Release --no-build \
            --collect:"XPlat Code Coverage" \
            --logger "junit;LogFilePath=$GITHUB_WORKSPACE/TestResults/integration.junit.xml" \
            --results-directory TestResults

      - name: Coverage report and gate
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          # Both test projects cover the same assembly; ReportGenerator merges their reports.
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:coverage -reporttypes:"Html;Badges;TextSummary;MarkdownSummaryGithub" \
            -assemblyfilters:"+ShopGuard.Core"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          line=$(grep -m1 "Line coverage" coverage/Summary.txt | grep -oE "[0-9]+(\.[0-9]+)?")
          echo "Line coverage: ${line}% (minimum: ${COVERAGE_THRESHOLD}%)"
          awk -v actual="$line" -v minimum="$COVERAGE_THRESHOLD" 'BEGIN { exit (actual + 0 < minimum + 0) }' \
            || { echo "::error::Line coverage ${line}% is below ${COVERAGE_THRESHOLD}%"; exit 1; }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-results
          path: TestResults/
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  # REST API scenarios (no browser needed).
  api:
    name: API (@api)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: API tests
        run: |
          # restful-booker is a shared public demo and sometimes slow, so the whole suite may
          # be repeated. Single scenarios are never retried: a scenario that only passes on
          # the second try would hide a real problem.
          for attempt in 1 2 3; do
            dotnet test ShopGuard/ShopGuard.E2ETests -c Release \
              --filter "TestCategory=api" \
              --logger "junit;LogFilePath=$GITHUB_WORKSPACE/TestResults/api.junit.xml" && exit 0
            echo "::warning::API suite failed on attempt $attempt"
          done
          exit 1
      - name: Collect execution report
        if: always()
        run: |
          mkdir -p api-report
          cp ShopGuard/ShopGuard.E2ETests/bin/Release/net10.0/reqnroll-report.html api-report/index.html || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-results
          path: |
            TestResults/
            api-report/

  # UI scenarios and the checks against the shop's own database. The shop is started on the
  # runner from docker/toolshop.compose.yml. Its API and UI images are amd64 and run natively;
  # the nginx image is arm64 and runs under QEMU.
  ui:
    name: UI & database (@ui)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHOPGUARD_ENV: selfhosted
      HEADLESS: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Register QEMU for the arm64 container
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Start the Toolshop
        run: scripts/start-toolshop.sh
      - name: Build and install Chromium
        run: |
          dotnet build ShopGuard/ShopGuard.E2ETests -c Release
          pwsh ShopGuard/ShopGuard.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: UI and database scenarios
        run: |
          # @wip marks the expected behaviour of an open product defect; it is red on purpose.
          dotnet test ShopGuard/ShopGuard.E2ETests -c Release --no-build \
            --filter "TestCategory=ui&TestCategory!=wip" \
            --logger "junit;LogFilePath=$GITHUB_WORKSPACE/TestResults/ui.junit.xml"
      - name: Toolshop logs
        if: failure()
        run: docker compose -f docker/toolshop.compose.yml logs --tail 200
      - name: Collect execution report
        if: always()
        run: |
          mkdir -p ui-report
          cp ShopGuard/ShopGuard.E2ETests/bin/Release/net10.0/reqnroll-report.html ui-report/index.html || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-results
          path: |
            TestResults/
            ui-report/
            ShopGuard/ShopGuard.E2ETests/bin/Release/net10.0/artifacts/

  # Publishes the reports of this run to GitHub Pages.
  pages:
    name: Publish reports (Pages)
    needs: [unit, api, ui]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # 8.0 is only needed by the LivingDoc CLI below.
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: site/coverage
      - uses: actions/download-artifact@v8
        with:
          name: api-results
          path: api-results
      - uses: actions/download-artifact@v8
        with:
          name: ui-results
          path: ui-results
      - name: Build site
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          # Execution reports: what ran in this pipeline and how each step ended
          mkdir -p site/test-report/api site/test-report/ui
          cp api-results/api-report/index.html site/test-report/api/index.html
          cp ui-results/ui-report/index.html site/test-report/ui/index.html
          # Living documentation: every scenario of the feature folder
          dotnet tool install --global SpecFlow.Plus.LivingDoc.CLI
          livingdoc feature-folder ShopGuard/ShopGuard.E2ETests/Features -o site/living-doc.html
          cp docs/pages/index.html site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
